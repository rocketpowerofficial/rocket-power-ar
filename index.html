<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Rocket Power | Strawberry Stardust AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10051c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#hud{position:fixed;z-index:1000;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(#16071fee,transparent);pointer-events:none}
#hud strong{letter-spacing:.12em;font-size:15px}#status{font-size:13px;line-height:1.4;color:#ffc5ef;margin-top:7px;max-width:90vw;overflow-wrap:anywhere}
#controls{position:fixed;z-index:1001;bottom:calc(22px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:12px;background:#ed259e;color:white;font-weight:750;font-size:15px;padding:15px 20px;box-shadow:0 4px 22px #0009}button:disabled{opacity:.5}#demoBtn{background:#493263}
#cameraTest{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#090410;z-index:2;display:none}
#scene{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
<video id="cameraTest" autoplay muted playsinline></video>
<div id="hud"><strong>ROCKET POWER • STRAWBERRY STARDUST</strong><div id="status">Tap Start Camera. If anything fails, the exact error will appear here.</div></div>
<div id="controls"><button id="startBtn">Start Camera</button><button id="demoBtn" disabled>Show 3D</button></div>
<a-scene id="scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"><a-entity id="demo" visible="false" position="0 0 -1.7" scale="0.45 0.45 0.45"></a-entity></a-camera>
<a-entity id="imageTarget" mindar-image-target="targetIndex: 0"><a-entity id="model" position="0 0 0.2" scale="0.55 0.55 0.55"></a-entity></a-entity>
<a-light type="ambient" intensity="1.6"></a-light><a-light type="directional" intensity="1.2" position="1 2 3" color="#ffb3f2"></a-light>
</a-scene>
<script>
const statusEl=document.querySelector('#status'), startBtn=document.querySelector('#startBtn'), demoBtn=document.querySelector('#demoBtn'), scene=document.querySelector('#scene'), cameraTest=document.querySelector('#cameraTest');
const setStatus=s=>statusEl.textContent=s;
window.addEventListener('error',e=>setStatus('JavaScript error: '+e.message));window.addEventListener('unhandledrejection',e=>setStatus('Startup error: '+String(e.reason?.message||e.reason)));
function node(parent,type,props){const n=document.createElement('a-'+type);Object.entries(props).forEach(([k,v])=>n.setAttribute(k,v));parent.appendChild(n);return n;}
function createAstronaut(parent){const root=node(parent,'entity',{animation:'property: position; to: 0 0.12 0; dir: alternate; dur: 1300; loop: true; easing: easeInOutSine'});
const rocket=node(root,'entity',{position:'0 -0.45 0',rotation:'0 0 -12'});
node(rocket,'cylinder',{radius:'.2',height:'1.4',rotation:'0 0 90',color:'#9fa9c6',material:'metalness:0.6;roughness:0.3'});
node(rocket,'cone',{radiusBottom:'.2',height:'.44',rotation:'0 0 -90',position:'.91 0 0',color:'#ff37ae'});
node(rocket,'cone',{radiusBottom:'.14',height:'.6',rotation:'0 0 90',position:'-.94 0 0',material:'color:#ff69bd;emissive:#f0178b;emissiveIntensity:1.3;transparent:true;opacity:.85',animation:'property: scale; to: 1 1.4 1; dir: alternate; dur: 220; loop: true'});
node(rocket,'box',{width:'.3',height:'.4',depth:'.09',position:'-.42 -.19 0',rotation:'0 0 25',color:'#d62b9e'});
node(rocket,'sphere',{radius:'.14',position:'0 0 .18',color:'#210d31'});
node(root,'cylinder',{radius:'.26',height:'.55',position:'-.15 -.03 0',color:'#c9bfd9'});
node(root,'sphere',{radius:'.38',scale:'1 .94 .85',position:'-.16 .45 0',color:'#e2d9ed'});
node(root,'sphere',{radius:'.29',scale:'1 .94 .8',position:'-.16 .48 .24',color:'#170b28',material:'metalness:.5;roughness:.12'});
[-.27,-.05].forEach(x=>node(root,'sphere',{radius:'.052',position:`${x} .52 .46`,material:'color:#ff80d8;emissive:#ff28bd;emissiveIntensity:2'}));
[-.46,.16].forEach(x=>node(root,'cylinder',{radius:'.11',height:'.38',position:`${x} .04 0`,rotation:`0 0 ${x<0?30:-30}`,color:'#e3d5ed'}));
[-.32,.03].forEach(x=>node(root,'cylinder',{radius:'.12',height:'.38',position:`${x} -.39 0`,color:'#d6c6e5'}));
for(let i=0;i<7;i++){const a=i*Math.PI*2/7;node(root,'sphere',{radius:'.045',position:`${Math.cos(a)*.88} ${Math.sin(a)*.9} -.15`,material:'color:#ff64d0;emissive:#f017a6;emissiveIntensity:1.4'});} }
createAstronaut(document.querySelector('#demo'));createAstronaut(document.querySelector('#model'));
scene.addEventListener('arReady',()=>{setStatus('Camera running. Point it at the Strawberry Stardust front.');demoBtn.disabled=false;startBtn.textContent='Camera Running';});
scene.addEventListener('arError',e=>{setStatus('AR engine failed. Check targets.mind and camera permissions. '+(e.detail?.message||''));startBtn.disabled=false;startBtn.textContent='Retry Camera';});
document.querySelector('#imageTarget').addEventListener('targetFound',()=>setStatus('Artwork recognized! 3D astronaut anchored.'));
document.querySelector('#imageTarget').addEventListener('targetLost',()=>setStatus('Camera running. Point at Strawberry Stardust artwork.'));
startBtn.onclick=async()=>{startBtn.disabled=true;setStatus('Step 1: checking camera permission…');let stream;
try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera API unavailable. Open HTTPS link directly in Safari.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});cameraTest.srcObject=stream;cameraTest.style.display='block';await cameraTest.play();setStatus('Camera permission works. Step 2: starting image tracking…');}catch(e){setStatus('CAMERA ERROR: '+e.name+' — '+e.message);startBtn.disabled=false;startBtn.textContent='Retry Camera';return;}
await new Promise(r=>setTimeout(r,450));cameraTest.pause();cameraTest.srcObject=null;cameraTest.style.display='none';stream.getTracks().forEach(t=>t.stop());
try{if(!scene.hasLoaded)await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('3D engine did not load in 15 seconds')),15000);scene.addEventListener('loaded',()=>{clearTimeout(timeout);resolve();},{once:true});});const system=scene.systems['mindar-image-system'];if(!system)throw Error('MindAR library did not initialize. Check internet/CDN.');await system.start();demoBtn.disabled=false;setStatus('Camera running. Point at Strawberry Stardust artwork.');startBtn.textContent='Camera Running';}catch(e){setStatus('TRACKING ERROR: '+(e.message||String(e)));startBtn.disabled=false;startBtn.textContent='Retry Camera';}};
demoBtn.onclick=()=>{const d=document.querySelector('#demo'),next=!d.getAttribute('visible');d.setAttribute('visible',next);demoBtn.textContent=next?'Hide 3D':'Show 3D';setStatus(next?'3D test enabled. Astronaut should float in front of camera.':'Point at Strawberry Stardust artwork.');};
</script></body></html>
