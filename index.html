<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rocket Power — Fresh 3D AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080312;font-family:system-ui;color:white}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important}
.a-canvas,canvas{width:100%!important;height:100%!important}
#bar{position:fixed;z-index:9999;top:env(safe-area-inset-top,0px);left:0;right:0;padding:15px 16px;background:linear-gradient(#130520df,transparent);pointer-events:none}
#bar b{letter-spacing:.14em}#status{display:block;font-size:12px;color:#ffb7ed;margin-top:6px}
#switch{position:fixed;z-index:10000;right:12px;top:90px;border:0;background:#df18a3;color:white;border-radius:12px;padding:13px 16px;font-weight:800}
#foot{position:fixed;z-index:9999;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;padding:20px;text-align:center;background:linear-gradient(transparent,#17061ddc);font-size:12px;pointer-events:none}
</style></head><body>
<div id="bar"><b>ROCKET POWER — FRESH 3D</b><span id="status">Loading camera and 3D engine…</span></div>
<button id="switch">Show 3D Demo</button><div id="foot">Point camera at Strawberry Stardust artwork</div>
<a-scene id="scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no" embedded renderer="antialias: true; alpha: true; colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"><a-entity id="demo" visible="false" position="0 -0.1 -1.5" scale=".48 .48 .48"></a-entity></a-camera>
<a-entity mindar-image-target="targetIndex: 0" id="target"><a-entity id="tracked" position="0 0 .25" scale=".6 .6 .6"></a-entity></a-entity>
<a-light type="ambient" intensity="1.5" color="#ffd6f9"></a-light>
<a-light type="point" intensity="2.5" color="#ff37bf" position="-1 2 2"></a-light>
<a-light type="point" intensity="1.8" color="#9d6cff" position="2 1 1"></a-light>
</a-scene>
<script>
const status=document.getElementById('status'),button=document.getElementById('switch'),demo=document.getElementById('demo'),tracked=document.getElementById('tracked');
function shape(parent,tag,attrs){const el=document.createElement('a-'+tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.appendChild(el);return el;}
function build(parent){
const bob=shape(parent,'entity',{'animation':'property: position; to: 0 .09 0; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine'});
const rocket=shape(bob,'entity',{rotation:'0 0 -12',position:'0 -.47 0'});
shape(rocket,'cylinder',{radius:'.19',height:'1.3',rotation:'0 0 -90',position:'.05 0 0',color:'#9aa4c4',metalness:'.8'});
shape(rocket,'cone',{radiusBottom:'.19',height:'.42',rotation:'0 0 -90',position:'.91 0 0',color:'#f42da8',metalness:'.5'});
shape(rocket,'cone',{radiusBottom:'.15',height:'.48',rotation:'0 0 90',position:'-.83 0 0',color:'#ff70c7',material:'emissive:#ff148d;emissiveIntensity:1.5;opacity:.75;transparent:true',animation:'property: scale; to: 1 1.4 1; dir: alternate; dur: 230; loop: true'});
shape(rocket,'box',{width:'.3',height:'.3',depth:'.06',rotation:'0 0 35',position:'-.35 -.2 0',color:'#e72fa5'});
shape(rocket,'circle',{radius:'.16',position:'0 0 .195',color:'#1c102e'});
shape(rocket,'text',{value:'RP',align:'center',color:'#ff4ab8',width:'.65',position:'0 -.04 .205'});
shape(bob,'sphere',{radius:'.37',scale:'1 .92 .78',position:'-.16 .45 0',color:'#ded6ec',metalness:'.4'});
shape(bob,'sphere',{radius:'.29',scale:'1 .94 .8',position:'-.16 .49 .22',color:'#140721',material:'color:#140721;metalness:.5;roughness:.1'});
for(let x of [-.27,-.05])shape(bob,'sphere',{radius:'.055',position:`${x} .53 .44`,material:'color:#ffb8f3;emissive:#ff24c5;emissiveIntensity:2'});
shape(bob,'cylinder',{radius:'.27',height:'.55',position:'-.21 -.03 0',color:'#b3a7c8',metalness:'.5'});
shape(bob,'box',{width:'.33',height:'.24',depth:'.1',position:'-.21 .02 .26',color:'#25132d'});
shape(bob,'text',{value:'RP',align:'center',color:'#ff55c3',width:'.7',position:'-.21 -.05 .32'});
for(let x of [-.49,.07]){shape(bob,'cylinder',{radius:'.105',height:'.43',position:`${x} .05 0`,rotation:`0 0 ${x<0?35:-45}`,color:'#d8cde9'});}
for(let x of [-.35,-.03])shape(bob,'cylinder',{radius:'.12',height:'.4',position:`${x} -.4 0`,rotation:'0 0 -24',color:'#d4c5df'});
for(let i=0;i<8;i++){let angle=i*Math.PI*2/8;shape(bob,'sphere',{radius:'.055',position:`${Math.cos(angle)*.95} ${Math.sin(angle)*.9} -.15`,material:'color:#ff64cf;emissive:#ff0e99;emissiveIntensity:1.5',animation:`property: scale; to: 1.8 1.8 1.8; dir: alternate; dur: ${550+i*100}; loop: true`});}
}
build(demo);build(tracked);
button.onclick=()=>{const on=demo.getAttribute('visible')!==true;demo.setAttribute('visible',on);button.textContent=on?'Hide 3D Demo':'Show 3D Demo';status.textContent=on?'3D demo visible — astronaut and rocket should float in front of you':'Scanning for Strawberry Stardust package…'};
const target=document.getElementById('target');target.addEventListener('targetFound',()=>status.textContent='Package recognized — 3D model anchored');target.addEventListener('targetLost',()=>status.textContent='Package lost — point at the front artwork');
document.getElementById('scene').addEventListener('arReady',()=>status.textContent='Camera ready — tap Show 3D Demo to test model');
document.getElementById('scene').addEventListener('arError',()=>status.textContent='AR failed to start — check camera permission and targets.mind');
setTimeout(()=>{if(status.textContent.startsWith('Loading'))status.textContent='Still loading — check internet, camera permissions, and targets.mind'},10000);
</script></body></html>
