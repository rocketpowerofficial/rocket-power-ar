<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rocket Power | Strawberry Stardust 3D AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;background:#07030d;color:#fff;font-family:system-ui;overflow:hidden}#hud{position:fixed;z-index:20;left:0;right:0;top:0;padding:18px 16px;background:linear-gradient(#12051be8,transparent);pointer-events:none}#hud strong{letter-spacing:.13em}#status{display:block;font-size:12px;color:#ffb8e8;margin-top:7px}#footer{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:20px 16px 25px;text-align:center;background:linear-gradient(transparent,#12051be8);font-size:12px;pointer-events:none}#demo{position:fixed;z-index:25;right:12px;top:80px;padding:10px 12px;background:#bd178f;color:white;border:1px solid #f9a0dc;border-radius:9px;font-weight:700}a-scene{position:fixed;inset:0}</style></head><body><div id="hud"><strong>ROCKET POWER</strong><span id="status">Initializing 3D camera experience…</span></div><button id="demo">3D Preview</button><div id="footer">Point camera at the Strawberry Stardust front artwork</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes; filterMinCF: 0.0001; filterBeta: 10" embedded renderer="colorManagement: true; alpha: true; antialias: true" color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-camera position="0 0 0" look-controls="enabled: false"><a-entity id="preview" position="0 -0.08 -1.6" visible="false" scale="0.65 0.65 0.65"></a-entity></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-entity id="tracked" position="0 0 0.18" scale="0.58 0.58 0.58"></a-entity></a-entity>
<a-light type="ambient" color="#ffc8fa" intensity="1.25"></a-light><a-light type="point" position="-1 2 2" color="#ff31b6" intensity="2.5"></a-light><a-light type="point" position="2 1 1" color="#8b5bff" intensity="1.8"></a-light></a-scene>
<script>
// Procedurally constructed, fully three-dimensional stylized Galaxy Ghost mascot.
AFRAME.registerComponent('ghost-ride',{init:function(){let root=this.el;const make=(tag,attrs,parent=root)=>{let e=document.createElement('a-'+tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e};
let ride=make('entity',{'animation':'property: position; from: 0 -0.07 0; to: 0 0.07 0; dur: 2200; dir: alternate; loop: true; easing: easeInOutSine','rotation':'0 -22 -12'});
const metal='#aab3d1',trim='#ff39bb',dark='#20142e';
// Rocket body: cylinder points along local Y, rotate to X-axis.
make('cylinder',{position:'0 -0.47 0',radius:'.18',height:'1.03',rotation:'0 0 -90',color:'#727b97','metalness':'.85','roughness':'.22'},ride);
make('cone',{position:'.67 -0.47 0',radiusBottom:'.18',radiusTop:'0',height:'.43',rotation:'0 0 -90',color:trim,'metalness':'.6'},ride);
make('cone',{position:'-.58 -0.47 0',radiusBottom:'.17',radiusTop:'.08',height:'.22',rotation:'0 0 90',color:'#4d4767'},ride);
for(let i=0;i<3;i++){make('box',{position:`-.35 ${-.47+Math.cos(i*2.094)*.19} ${Math.sin(i*2.094)*.19}`,width:'.32',height:'.08',depth:'.23',rotation:`${i*120} 0 -18`,color:'#bd3b94','metalness':'.5'},ride)}
make('sphere',{position:'-.86 -0.47 0',radius:'.14',scale:'1.9 .75 .75',color:'#ff4bbd',material:'shader: flat; transparent: true; opacity: .65','animation':'property: scale; from: 1.3 .65 .65; to: 2.7 1.15 1.15; dur: 550; dir: alternate; loop: true'},ride);
make('sphere',{position:'0 -0.47 .19',radius:'.125',color:'#1d1027'},ride);make('text',{value:'RP',position:'-.095 -.525 .302',width:'.36',color:'#ff53c5',align:'center'},ride);
// Astronaut torso, backpack, head and luminous face.
make('box',{position:'-.20 .11 -.12',width:'.40',height:'.47',depth:'.27',color:metal,'metalness':'.5'},ride);
make('box',{position:'-.2 .13 -.31',width:'.38',height:'.37',depth:'.20',color:dark},ride);
make('sphere',{position:'-.20 .57 .015',radius:'.28',color:'#d5c9ec','metalness':'.6','roughness':'.2'},ride);
make('sphere',{position:'-.20 .57 .205',radius:'.22',scale:'1 1 .4',color:'#120a22',material:'color: #10071c; metalness: .4; roughness: .12'},ride);
for(let x of [-.29,-.10])make('sphere',{position:`${x} .59 .292`,radius:'.033',material:'color: #ff91ec; emissive: #ff1cbd; emissiveIntensity: 3'},ride);
make('box',{position:'-.2 .09 .045',width:'.25',height:'.20',depth:'.075',color:dark},ride);
make('text',{value:'RP',position:'-.30 .025 .088',width:'.43',color:'#ff48c0',align:'center'},ride);
// Bent arms and legs, spherical joints.
for(let s of [-1,1]){let x=-.2+s*.28;make('cylinder',{position:`${x} .16 .03`,radius:'.095',height:'.33',rotation:`0 0 ${s*43}`,color:metal},ride);make('sphere',{position:`${x+s*.1} .27 .06`,radius:'.1',color:'#b8b2d4'},ride);make('cylinder',{position:`${x} -.23 .05`,radius:'.115',height:'.36',rotation:`0 0 ${s*20}`,color:metal},ride);make('sphere',{position:`${x} -.39 .13`,radius:'.11',color:'#a8a2be'},ride)}
make('sphere',{position:'.18 .39 .1',radius:'.095',color:'#e6cce8'},ride);
// Orbit rings, 3D star particles, strawberries as red 3D fruit-like shapes.
let orbit=make('entity',{'animation':'property: rotation; to: 0 360 0; dur: 8500; loop: true; easing: linear'});
make('torus',{position:'0 0 0',radius:'1.04','radius-tubular':'.009',rotation:'68 0 0',material:'color: #ff48bd; emissive: #ff2caa; emissiveIntensity: 2; transparent: true; opacity: .8'},orbit);
for(let i=0;i<16;i++){let a=i*2.399,y=Math.sin(i*1.6)*.7,x=Math.cos(a)*(.7+(i%4)*.11),z=Math.sin(a)*(.6+(i%3)*.1);make('sphere',{position:`${x} ${y} ${z}`,radius:i%4===0?'.052':'.022',material:`color: ${i%3===0?'#ffe1f6':'#ff45bd'}; emissive: #ff25a5; emissiveIntensity: 1.5`},orbit)}
for(let i=0;i<3;i++){let a=i*2.09;let fruit=make('entity',{position:`${Math.cos(a)*.87} ${Math.sin(a)*.53} .25`},orbit);make('sphere',{radius:'.085',scale:'1 1.18 .85',color:'#e71d65'},fruit);make('cone',{position:'0 .10 0',radiusBottom:'.075',height:'.06',color:'#61c44b'},fruit)}
}});
function mount(id){let e=document.createElement('a-entity');e.setAttribute('ghost-ride','');document.getElementById(id).appendChild(e)}mount('tracked');mount('preview');
const target=document.getElementById('target'),status=document.getElementById('status'),foot=document.getElementById('footer');target.addEventListener('targetFound',()=>{status.textContent='3D GALAXY GHOST LOCKED';foot.textContent='Move your phone to view the mascot from different angles'});target.addEventListener('targetLost',()=>{status.textContent='Looking for Strawberry Stardust artwork…';foot.textContent='Keep the full package front visible'});
let on=false;document.getElementById('demo').onclick=()=>{on=!on;document.getElementById('preview').setAttribute('visible',on);document.getElementById('demo').textContent=on?'Hide Preview':'3D Preview';status.textContent=on?'3D preview mode (not package tracking)':'Point at the Strawberry Stardust package'};
window.addEventListener('error',e=>{if(String(e.message).includes('targets.mind'))status.textContent='Missing targets.mind — add compiled tracking file to site root'});
</script></body></html>
